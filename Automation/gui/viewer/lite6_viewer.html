<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lite 6 — Live 3D Workcell</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d23; overflow: hidden;
               font-family: Arial, Helvetica, sans-serif; }
  #c { width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; right: 12px; top: 48px; color: #cfd2da; font-size: 12px;
         background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px;
         max-width: 36vw; line-height: 1.35; text-align: right; }
  #hud b { color: #ff5a4d; }
  #err { position: fixed; left: 45vw; bottom: 12px; right: 12px; color: #ffb3ad;
         font-size: 12px; white-space: pre-wrap; background: rgba(60,0,0,.4);
         padding: 8px 10px; border-radius: 6px; display: none; }
  #status { position: fixed; right: 12px; top: 10px; color: #8f9; font-size: 12px;
            background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px; }
  .station-label {
    color: #ff5a4d; font-size: 13px; font-weight: bold;
    background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 4px;
    white-space: nowrap; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Lite 6 workcell</b><br/>
  drag to orbit · scroll to zoom<br/>
  <span style="color:#9aa">Test controls stay in the floating Tk window</span>
</div>
<div id="status">connecting…</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/": "https://unpkg.com/three@0.160.0/",
    "urdf-loader": "https://unpkg.com/urdf-loader@0.12.6/src/URDFLoader.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';
import { STLLoader } from 'three/examples/jsm/loaders/STLLoader.js';
import URDFLoader from 'urdf-loader';

const errBox = document.getElementById('err');
const statusBox = document.getElementById('status');
function showErr(msg) { errBox.style.display = 'block'; errBox.textContent += msg + '\n'; }
window.addEventListener('error', e => showErr('JS error: ' + (e.message || e)));

// ---- scene ----
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1b1d23);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
// Default pose: arm sits in the visible band to the RIGHT of the floating Tk
// panel (panel covers ~left 45% when docked). View-offset recenters the arm
// in that clear region — matches the desired left-GUI / right-workcell layout.
camera.position.set(0.75, 0.72, 1.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.05, 0.32, 0.0);
controls.enableDamping = true;

// Fraction of the browser width covered by the left-docked Tk panel (approx).
const TK_OVERLAY_FRAC = 0.45;

function applyGuiSafeFraming() {
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  const xOff = Math.floor(w * TK_OVERLAY_FRAC);
  const viewW = Math.max(1, w - xOff);
  // Render as if the "real" viewport is only the clear band on the right, so
  // the arm at the origin appears centered in what the operator can see.
  camera.setViewOffset(w, h, xOff, 0, viewW, h);
}

applyGuiSafeFraming();
window.addEventListener('resize', applyGuiSafeFraming);

// lighting — soft studio feel
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(1.5, 2.5, 1.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1; key.shadow.camera.far = 10;
key.shadow.camera.left = -1.5; key.shadow.camera.right = 1.5;
key.shadow.camera.top = 1.5; key.shadow.camera.bottom = -1.5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-1.5, 1.0, -1.0);
scene.add(fill);

// ground + grid
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.28 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(4, 40, 0x3a3d47, 0x2a2d36);
scene.add(grid);

// ---- load the Lite 6 URDF ----
let robot = null;
let cardMesh = null;
let flangeLink = null;
const JOINTS = ['joint1','joint2','joint3','joint4','joint5','joint6'];
const manager = new THREE.LoadingManager();
const loader = new URDFLoader(manager);

// map package://lite6_description -> served /meshes
loader.packages = { lite6_description: 'meshes' };
loader.loadMeshCb = (path, mgr, done) => {
  new STLLoader(mgr).load(
    path,
    geom => {
      geom.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial(
        { color: 0xe9e9ec, metalness: 0.25, roughness: 0.6 });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      done(mesh);
    },
    undefined,
    e => showErr('mesh load failed: ' + path + '  (' + e + ')'));
};

function findFlange(root) {
  let found = null;
  root.traverse(o => {
    const n = (o.name || '').toLowerCase();
    if (n === 'link6' || n === 'link_eef' || n === 'link_tcp' || n.endsWith('link6')) {
      found = o;
    }
  });
  if (found) return found;
  // fallback: deepest mesh-bearing child along the chain
  let deepest = root;
  root.traverse(o => { if (o.isMesh) deepest = o.parent || o; });
  return deepest;
}

function makeCard() {
  const geom = new THREE.BoxGeometry(0.054, 0.0012, 0.086); // ISO card-ish
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, metalness: 0.05, roughness: 0.55, emissive: 0x222222,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.castShadow = true;
  // hang just below the suction cup along local -Z of the flange (URDF Z-up tool)
  mesh.position.set(0, 0, -0.012);
  mesh.visible = false;
  return mesh;
}

function applyJoints(degs) {
  if (!robot || !Array.isArray(degs)) return;
  for (let i = 0; i < JOINTS.length && i < degs.length; i++) {
    robot.setJointValue(JOINTS[i], degs[i] * Math.PI / 180.0);
  }
  robot.updateMatrixWorld(true);
}

function placeStations(stations) {
  if (!robot || !Array.isArray(stations)) return;
  const saved = JOINTS.map(n => {
    const j = robot.joints && robot.joints[n];
    return j ? j.angle : 0;
  });
  const colors = { drop: 0xc44, pickup: 0x4a8, reader: 0x48a, flip: 0xa84 };
  for (const st of stations) {
    if (!st || !Array.isArray(st.j)) continue;
    applyJoints(st.j);
    const tip = new THREE.Vector3();
    if (flangeLink) {
      flangeLink.getWorldPosition(tip);
    } else {
      tip.set(0, 0.05, 0);
    }
    const marker = new THREE.Group();
    const pad = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.01, 0.08),
      new THREE.MeshStandardMaterial({
        color: colors[st.id] || 0xff5a4d,
        metalness: 0.2, roughness: 0.7, transparent: true, opacity: 0.85,
      }));
    pad.position.y = 0.005;
    pad.castShadow = true;
    pad.receiveShadow = true;
    marker.add(pad);
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.004, 0.004, Math.max(0.02, tip.y), 8),
      new THREE.MeshStandardMaterial({ color: 0x666870, metalness: 0.3, roughness: 0.6 }));
    stem.position.y = Math.max(0.02, tip.y) / 2;
    marker.add(stem);
    // floor XY from flange world position (three.js Y-up after robot.rotation.x)
    marker.position.set(tip.x, 0, tip.z);

    const el = document.createElement('div');
    el.className = 'station-label';
    el.textContent = st.label || st.id;
    const label = new CSS2DObject(el);
    label.position.set(0, Math.max(0.06, tip.y + 0.04), 0);
    marker.add(label);
    scene.add(marker);
  }
  applyJoints(saved.map(a => a * 180 / Math.PI));
}

loader.load('lite6.urdf',
  result => {
    robot = result;
    // URDF is Z-up (meters); rotate into three.js Y-up
    robot.rotation.x = -Math.PI / 2;
    robot.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(robot);
    flangeLink = findFlange(robot);
    cardMesh = makeCard();
    if (flangeLink) {
      flangeLink.add(cardMesh);
    } else {
      scene.add(cardMesh);
    }
    statusBox.textContent = 'model loaded';
    fetch('stations', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d && d.stations) placeStations(d.stations);
      })
      .catch(e => showErr('stations: ' + e));
  },
  undefined,
  e => showErr('URDF load failed: ' + e));

// ---- live joint + suction feed (poll /joints) ----
let haveData = false;
async function poll() {
  try {
    const r = await fetch('joints', { cache: 'no-store' });
    if (r.ok) {
      const d = await r.json();
      if (robot && Array.isArray(d.j)) {
        applyJoints(d.j);
        if (!haveData) { haveData = true; }
        const suck = !!d.suction;
        if (cardMesh) cardMesh.visible = suck;
        statusBox.textContent = suck ? 'live ● card held' : 'live ●';
        statusBox.style.color = suck ? '#fc6' : '#8f9';
      }
    }
  } catch (e) {
    statusBox.textContent = 'no signal';
    statusBox.style.color = '#fb8';
  }
}
setInterval(poll, 80);

// ---- render loop ----
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    applyGuiSafeFraming();
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
  }
}
function animate() {
  resize();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
